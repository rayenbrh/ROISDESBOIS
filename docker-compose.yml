version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: roisdesbois-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: roisdesbois
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - roisdesbois-network

  # Redis (for Bull Queue)
  redis:
    image: redis:7-alpine
    container_name: roisdesbois-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - roisdesbois-network
    command: redis-server --appendonly yes

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roisdesbois-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://root:rootpassword@mongodb:27017/roisdesbois?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USE_QUEUE: "true"
      JWT_ACCESS_SECRET: your_super_secret_access_key_change_in_production
      JWT_REFRESH_SECRET: your_super_secret_refresh_key_change_in_production
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - roisdesbois-network

  # Frontend (Nginx serving static files)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roisdesbois-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - roisdesbois-network

networks:
  roisdesbois-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
