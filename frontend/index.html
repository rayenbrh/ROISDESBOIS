<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="لوحة تحكم Les Rois des Bois - نظام إدارة شامل للأثاث" />
    <meta name="theme-color" content="#D4AF37" />

    <!-- Google Fonts - Cairo (Arabic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <title>لوحة تحكم Les Rois des Bois</title>

    <style>
      /* Loading screen */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #0E0E0E 0%, #1a1a1a 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }

      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-logo {
        width: 100px;
        height: 100px;
        margin-bottom: 20px;
        animation: pulse 2s ease-in-out infinite;
      }

      .loading-text {
        color: #D4AF37;
        font-family: 'Cairo', sans-serif;
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 20px;
      }

      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(212, 175, 55, 0.1);
        border-radius: 50%;
        border-top-color: #D4AF37;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen -->
    <div id="loading-screen">
      <div class="loading-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="#D4AF37">
          <path d="M50 10L80 30V70L50 90L20 70V30L50 10Z" stroke="#D4AF37" stroke-width="2" fill="none"/>
          <circle cx="50" cy="50" r="15" fill="#D4AF37"/>
        </svg>
      </div>
      <div class="loading-text">لوحة تحكم Les Rois des Bois</div>
      <div class="loading-spinner"></div>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Hide loading screen when app is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.classList.add('hidden');
            setTimeout(() => loadingScreen.remove(), 500);
          }
        }, 500);
      });
    </script>
  </body>
</html>
